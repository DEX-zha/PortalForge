<!-- 3D placement editor view (feature 003). Served verbatim by src/editor/server.mjs; no build step, no bundler,
     so reading the shipped file and reading the source is the same act. -->
<meta charset="utf-8">
<title>PortalForge placement editor</title>
<style>
  :root { color-scheme: dark; --bg: #16181d; --panel: #1e2128; --line: #2c313b; --text: #d8dce4; --dim: #8b93a3;
          --critical: #e5484d; --high: #e59a3a; --medium: #d6c02e; --static: #7fc08a; --marker: #6a7b93; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 260px 1fr 380px; grid-template-rows: 44px 1fr;
         background: var(--bg); color: var(--text); font: 13px/1.5 system-ui, sans-serif; overflow: hidden; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 14px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header b { font-weight: 600; }
  header .dim { color: var(--dim); }
  aside, section { overflow-y: auto; background: var(--panel); }
  aside { border-right: 1px solid var(--line); }
  section { border-left: 1px solid var(--line); }
  h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
       margin: 14px 12px 6px; font-weight: 600; }
  #canvas-wrap { position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  #hint { position: absolute; left: 12px; bottom: 10px; color: var(--dim); font-size: 12px; pointer-events: none; }
  .layer { display: flex; align-items: center; gap: 8px; padding: 3px 12px; cursor: pointer; }
  .layer:hover { background: #262a33; }
  .layer input { margin: 0; }
  .layer .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer .c { color: var(--dim); font-variant-numeric: tabular-nums; }
  .bar { display: flex; height: 3px; margin: 0 12px 8px; border-radius: 2px; overflow: hidden; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 12px; }
  .row .k { color: var(--dim); }
  .row .v { text-align: right; word-break: break-all; }
  .ev { font-size: 11px; color: var(--dim); }
  .ev.runtime { color: var(--static); }
  .rule { margin: 6px 12px; padding: 7px 9px; border-left: 3px solid var(--line); background: #23272f; border-radius: 0 3px 3px 0; }
  .rule .id { font-weight: 600; }
  .rule .why { color: var(--dim); font-size: 11px; margin-top: 3px; }
  .rule.critical { border-left-color: var(--critical); }
  .rule.high { border-left-color: var(--high); }
  .rule.medium { border-left-color: var(--medium); }
  .rule.blocking { border-left-color: var(--critical); background: #2a1f22; }
  button.on { background: #3c4657; border-color: #4a566b; }
  #dirty.on { color: var(--high); }
  .num { width: 72px; background: #23272f; border: 1px solid var(--line); color: var(--text); border-radius: 3px;
         padding: 2px 4px; font: inherit; text-align: right; }
  .empty { color: var(--dim); padding: 12px; }
  button { background: #2b313c; color: var(--text); border: 1px solid var(--line); border-radius: 4px;
           padding: 4px 9px; cursor: pointer; font: inherit; }
  button:hover { background: #333a47; }
  #error { position: absolute; inset: 0; display: grid; place-items: center; padding: 40px; text-align: center;
           color: var(--high); background: var(--bg); }
</style>

<header>
  <b>Placement editor</b>
  <span class="dim" id="file">opening…</span>
  <span class="dim" id="counts"></span>
  <span style="flex:1"></span>
  <span id="tools"><button id="gizmo-move">Move</button><button id="gizmo-rotate">Rotate</button><button id="gizmo-scale">Scale</button><button id="gizmo-off">Off</button></span>
  <button id="frame-all">Frame level</button>
  <button id="frame-sel">Frame selection</button>
  <button id="undo">Undo</button><button id="redo">Redo</button>
  <span id="dirty" class="dim"></span>
  <span class="dim" id="evidence-note"></span>
</header>

<aside>
  <h2>Layers</h2>
  <div id="layer-actions" style="display:flex;gap:6px;padding:0 12px 8px">
    <button id="all-on">All</button><button id="all-off">None</button>
  </div>
  <div id="layers"></div>
</aside>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="hint">drag to orbit · right-drag to pan · wheel to zoom · click a proxy, click again to reach what is behind it</div>
  <div id="error" hidden></div>
</div>

<section>
  <h2>Save, patch, launch</h2>
  <div id="save-panel" style="padding:0 12px 10px">
    <div class="row"><span class="k">state</span><span class="v" id="save-state">no edit yet</span></div>
    <div style="display:flex;gap:6px;margin:6px 0"><button id="save">Save</button><button id="do-patch">Patch</button><button id="do-launch">Launch</button></div>
    <input id="prediction" placeholder="what should be visible after this change" style="width:100%;background:#23272f;border:1px solid var(--line);color:var(--text);border-radius:4px;padding:5px 7px;font:inherit">
    <div class="ev" id="save-note" style="margin-top:6px"></div>
  </div>
  <h2>Selection</h2>
  <div id="inspector"><div class="empty">Nothing selected. Click a proxy in the view.</div></div>
</section>

<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
<script type="module" src="/view/app.mjs"></script>

<!DOCTYPE html>
<!-- 3D placement editor view (feature 003). Served verbatim by src/editor/server.mjs; no build step, no bundler,
     so reading the shipped file and reading the source is the same act.

     The doctype is not decoration. Without it the browser renders in quirks mode, the height chain this layout
     depends on does not resolve, and the viewport column collapses to nothing while every panel around it looks
     correct. Do not remove it. -->
<meta charset="utf-8">
<title>PortalForge placement editor</title>
<style>
  :root { color-scheme: dark;
          --bg: #0f1319;        /* the ground of the survey */
          --panel: #151b23;     /* the paper the notes are written on */
          --line: #222c37;
          --text: #e8e2d4;      /* bone */
          --dim: #7e8b99;
          --critical: #d2553f; --high: #d98f3d; --medium: #d9a441; --static: #e8e2d4; --marker: #5d6b7a;
          --proven: #86b493;   /* observed in the running game, not inferred from bytes */
          --pick: #7fd4ff;      /* the one thing you are holding */
          --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
          --sans: ui-sans-serif, system-ui, 'Segoe UI', sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 260px 1fr 380px; grid-template-rows: 44px 1fr;
         background: var(--bg); color: var(--text); overflow: hidden;
         font: 13px/1.5 var(--sans); font-variant-numeric: tabular-nums; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 14px;
           border-bottom: 1px solid var(--line); background: var(--panel); overflow: hidden; }
  header b { font: 400 16px/1 var(--serif); letter-spacing: .01em; }
  header .dim { color: var(--dim); }
  aside, section { overflow-y: auto; background: var(--panel); }
  aside { border-right: 1px solid var(--line); }
  section { border-left: 1px solid var(--line); }
  h2 { font: 400 14px/1.2 var(--serif); color: var(--text); margin: 18px 12px 8px; padding-bottom: 5px;
       border-bottom: 1px solid var(--line); }
  /* min-height:0 stops this grid row from being sized by its content, and absolute positioning takes the canvas
     out of the percentage-height chain: that chain is what left the drawing buffer one pixel wide, stretched
     across the column as one flat colour and indistinguishable from an empty scene. */
  /* min-height:0 lets the grid row shrink; the floor stops it reaching zero, which is the state that hid both the
     viewport and every message inside it. */
  #canvas-wrap { position: relative; min-height: 240px; min-width: 0; overflow: hidden; }
  canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #hint { position: absolute; left: 12px; bottom: 10px; color: var(--dim); font-size: 12px; pointer-events: none; }
  #diag { color: var(--dim); font-size: 11px; white-space: nowrap; }
  #diag.bad { color: var(--high); }
  #tally { display: flex; gap: 14px; align-items: baseline; color: var(--dim); }
  #tally b { font: 500 13px/1 var(--sans); color: var(--text); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--pick); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  .layer { display: flex; align-items: center; gap: 8px; padding: 3px 12px; cursor: pointer; }
  .layer:hover { background: #1c242e; }
  .layer input { margin: 0; }
  .layer .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer .c { color: var(--dim); font-variant-numeric: tabular-nums; }
  .bar { display: flex; height: 3px; margin: 0 12px 8px; border-radius: 2px; overflow: hidden; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 12px; }
  .row .k { color: var(--dim); }
  .row .v { text-align: right; word-break: break-all; }
  .ev { font-size: 11px; color: var(--dim); }
  .ev.runtime { color: var(--proven); }
  .rule { margin: 6px 12px; padding: 7px 9px; border-left: 3px solid var(--line); background: #1a212a; border-radius: 0 3px 3px 0; }
  .rule .id { font-weight: 600; }
  .rule .why { color: var(--dim); font-size: 11px; margin-top: 3px; }
  .rule.critical { border-left-color: var(--critical); }
  .rule.high { border-left-color: var(--high); }
  .rule.medium { border-left-color: var(--medium); }
  .rule.blocking { border-left-color: var(--critical); background: #2b1b18; }
  button.on { background: #24313d; border-color: var(--pick); color: #cfeeff; }
  #dirty.on { color: var(--high); }
  .num { width: 76px; background: #0d1218; border: 1px solid var(--line); color: var(--text); border-radius: 3px;
         padding: 2px 4px; font: inherit; text-align: right; }
  .empty { color: var(--dim); padding: 12px; }
  button { background: #1c242e; color: var(--text); border: 1px solid var(--line); border-radius: 4px;
           padding: 4px 9px; cursor: pointer; font: inherit; }
  button:hover { background: #263341; border-color: #33414f; }
  button:disabled { opacity: .4; cursor: default; }
  #error { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 40px;
           text-align: center; color: var(--high); background: var(--bg); font-size: 14px; line-height: 1.6; }
  #error b { display: block; font: 400 18px/1.3 var(--serif); color: var(--text); margin-bottom: 10px; }
</style>

<header>
  <b>Placement editor</b>
  <span class="dim" id="file">opening…</span>
  <span id="tally"></span>
  <span id="diag" title="what the scene believes it is showing"></span>
  <span style="flex:1"></span>
  <span id="tools"><button id="gizmo-move">Move</button><button id="gizmo-rotate">Rotate</button><button id="gizmo-scale">Scale</button><button id="gizmo-off">Off</button></span>
  <button id="frame-all">Frame level</button>
  <button id="frame-sel">Frame selection</button>
  <button id="undo">Undo</button><button id="redo">Redo</button>
  <span id="dirty" class="dim"></span>
  <span class="dim" id="evidence-note" title="where the values in this session come from"></span>
</header>

<aside>
  <h2>Layers</h2>
  <div id="layer-actions" style="display:flex;gap:6px;padding:0 12px 8px">
    <button id="all-on">All</button><button id="all-off">None</button>
  </div>
  <div id="layers"></div>
</aside>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="hint">drag to orbit, right-drag to pan, wheel to zoom. Click a proxy; click again to reach what is behind it.</div>
  <div id="error" hidden></div>
</div>

<section>
  <h2>Save, patch, launch</h2>
  <div id="save-panel" style="padding:0 12px 10px">
    <div class="row"><span class="k">state</span><span class="v" id="save-state">no edit yet</span></div>
    <div style="display:flex;gap:6px;margin:6px 0"><button id="save">Save</button><button id="do-patch">Patch</button><button id="do-launch">Launch</button></div>
    <input id="prediction" placeholder="what should be visible after this change" style="width:100%;background:#0d1218;border:1px solid var(--line);color:var(--text);border-radius:4px;padding:5px 7px;font:inherit">
    <div class="ev" id="save-note" style="margin-top:6px"></div>
  </div>
  <h2>Selection</h2>
  <div id="inspector"><div class="empty">Nothing selected. Click a proxy in the view.</div></div>
</section>

<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
<script type="module" src="/view/app.mjs"></script>
